# SPDX-License-Identifier: MIT
# Builds ro:MINImal on every push: the host tests and the browser test page first, then the firmware package for
# the FM-1 with JieLi's toolchain and AC79 SDK (fetched by fm1-base's own scripts, at the commit base/ is pinned to).
# The package is kept as a workflow artifact, and a push to main publishes the site (GitHub Pages): the package, a
# link that opens it in fm1-emu, the manual and the browser test page. Pages must be set once to deploy from
# GitHub Actions (Settings > Pages > Source: GitHub Actions). Nothing is released: the firmware has not run on an
# FM-1 yet.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld libfribidi0
          python3 -m pip install -q Pillow
      - name: Core tests
        run: sh tests/run_tests.sh
      - name: Host simulator (fm1-base) and its test scripts (ro:MINImal and suom1saundi)
        run: |
          ./build.sh --host
          python3 base/tools/build.py app_suomi --host
          sh tests/run_tests.sh
      - name: Browser test page and manual
        run: |
          sh sim/build.sh
          python3 manual/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/tests/groove.wav
            build/tests/*.ppm
            app/build/host/*.png
          if-no-files-found: warn

  firmware:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0 xz-utils
          python3 -m pip install -q Pillow
      - name: JieLi toolchain and AC79 SDK (cached)
        id: jieli
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-${{ hashFiles('base/tools/get_toolchain.sh', 'base/bsp/tools/get_sdk.sh') }}
      - name: Fetch the toolchain and the SDK
        if: steps.jieli.outputs.cache-hit != 'true'
        run: |
          sh base/tools/get_toolchain.sh "$HOME/.jieli"
          # JieLi's SDK repository on GitHub is gone; Gitee is where JieLi maintains it (felucca-bsp's newer
          # get_sdk.sh defaults to it). Same revision, and the script checks the files' hashes.
          # The transfer from Gitee breaks off now and then: the script picks up where it stopped, so try again.
          git config --global http.version HTTP/1.1
          for try in 1 2 3 4 5 6; do
            if SDK_URL=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git \
                sh base/bsp/tools/get_sdk.sh "$HOME/.jieli/ac79-sdk"; then break; fi
            if [ "$try" = 6 ]; then echo "the SDK could not be fetched" >&2; exit 1; fi
            sleep 20
          done
      - name: Build the firmware package
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          ./build.sh
          python3 base/tools/build.py app_suomi     # the same firmware, starting as suom1saundi
          ls -l app/build/ app_suomi/build/
          sha256sum app/build/rominimal.fwsc app_suomi/build/suom1saundi.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            app/build/rominimal.fwsc
            app/build/rominimal.bin
            app/build/firmware.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-suom1saundi
          path: |
            app_suomi/build/suom1saundi.fwsc
            app_suomi/build/suom1saundi.bin
            app_suomi/build/firmware.json
          if-no-files-found: error

  pages:
    # the site: the package, a link that opens it in fm1-emu, the manual, the browser test page
    needs: firmware
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: firmware-suom1saundi
          path: dist-suomi
      - name: Build the site
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          python3 -m pip install -q Pillow
          sh tests/run_tests.sh >/dev/null    # (the screens the manual shows)
          sh sim/build.sh
          python3 manual/build.py
          python3 manual/suomi.py
          mkdir -p _site
          cp site/index.html _site/
          cp docs/manual.html _site/manual.html
          cp docs/suomi.html _site/suomi.html
          cp docs/index.html _site/testseite.html
          cp dist/rominimal.fwsc dist/firmware.json _site/
          cp dist-suomi/suom1saundi.fwsc _site/
          cp dist-suomi/firmware.json _site/firmware-suom1saundi.json
          (cd _site && sha256sum rominimal.fwsc suom1saundi.fwsc > SHA256SUMS)
          ls -l _site
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
